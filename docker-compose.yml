version: '3.9'

services:
  store:
    hostname: store
    container_name: cynthus-infra-store
    restart: unless-stopped
    stop_signal: SIGINT
    image: cynthus/infra-store:latest
    build:
      context: ./containers/store
    environment:
      - 'TZ=${TIME_ZONE}'
      - 'ACCEPT_EULA=Y'
      - 'MSSQL_SA_PASSWORD=${STORE_PASSWORD}'
    networks:
      - net
    logging:
      driver: json-file 

  messaging:
    hostname: messaging
    container_name: cynthus-infra-messaging
    restart: unless-stopped
    stop_signal: SIGINT
    image: cynthus/infra-messaging:latest
    build:
      context: ./containers/messaging
    environment:
      TZ: '${TIME_ZONE}'
      SQL_SERVER: store
      MSSQL_SA_PASSWORD: '${STORE_PASSWORD}'
      ACCEPT_EULA: 'Y'
    volumes:
      - './containers/messaging/conf:/opt/app/ConfigFiles'
    expose:
      - '5672/tcp' # AMQP port for messaging
      - '5300/tcp' # Management port
    networks:
      net:
        aliases:
          - 'sb.cynthus.local' # Consistent hostname for all repos
    depends_on:
      - store
    logging:
      driver: json-file 

  rabbitmq:
    # The RabbitMQ broker for SIGNAL_BROKER=rabbitmq (ADR-007). Off by default: start it with
    # `docker compose --profile rabbitmq up -d rabbitmq`. Services declare their own exchanges and queues.
    profiles:
      - rabbitmq
    hostname: rabbitmq
    container_name: cynthus-infra-rabbitmq
    restart: unless-stopped
    image: rabbitmq:4.4-management
    # Run as the rabbitmq user from the start: started as root, the image drops privileges with gosu and then cannot
    # read its own Erlang cookie under Colima.
    user: rabbitmq
    environment:
      TZ: '${TIME_ZONE}'
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-cynthus}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-}'
    volumes:
      - 'rabbitmq-data:/var/lib/rabbitmq'
    expose:
      - '5672/tcp' # AMQP port for messaging
    ports:
      - '${RABBITMQ_UI_PORT:-15672}:15672' # Management page and HTTP API
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      net:
        aliases:
          - 'rabbitmq.cynthus.local' # Consistent hostname for all repos
    logging:
      driver: json-file

  mail:
    hostname: mail
    container_name: cynthus-infra-mail
    restart: unless-stopped
    image: cynthus/infra-mail:latest
    build:
      context: ./containers/mail
    environment:
      TZ: '${TIME_ZONE}'
    expose:
      - '1025/tcp' # SMTP port; messages are kept here, never delivered
    ports:
      - '${MAIL_UI_PORT:-8025}:8025' # Inbox web page and HTTP API
    networks:
      net:
        aliases:
          - 'mail.cynthus.local' # Consistent hostname for all repos
    logging:
      driver: json-file

volumes:
  rabbitmq-data:

networks:
  net:
    external: true
    name: cynthus_net
